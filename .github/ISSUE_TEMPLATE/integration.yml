name: Integration problem
description: Report a reproducible problem with the supported developer release.
title: "Integration: "
body:
  - type: markdown
    attributes:
      value: |
        Include a minimal synthetic example. Never post tokens, private keys, account
        numbers, customer data or production database files. Private security reports:
        a@epv.ai. Real payment activation and institutional onboarding are separate
        from software installation.
  - type: input
    id: version
    attributes:
      label: Release and runtime
      description: Hellabit version, operating system, Python and loaded SQLite versions.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Smallest reproduction
      description: Commands and synthetic inputs, with the expected and observed result.
    validations:
      required: true
  - type: textarea
    id: recovery
    attributes:
      label: Recovery state
      description: If a reply was lost, say whether the original identity is prepared, submitting, unknown or confirmed. Keep the original key private.
  - type: checkboxes
    id: privacy
    attributes:
      label: Public report
      options:
        - label: This report contains synthetic data and no credentials or personal/customer information.
          required: true
