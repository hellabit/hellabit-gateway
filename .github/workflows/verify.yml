name: Verify Hellabit
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: python3 scripts/verify.py
      - name: Report verification failure
        if: failure()
        run: |
          python3 - <<'PY'
          import re
          import sqlite3
          from pathlib import Path
          print('Loaded SQLite:', sqlite3.sqlite_version)
          for name in ('evidence/terminal-result.json', 'evidence/python-tests.log', 'evidence/contracts.log', 'evidence/sdk.log', 'evidence/browser.log'):
              path = Path(name)
              if path.is_file():
                  text = path.read_text(errors='replace')[-16000:]
                  text = re.sub(r'[A-Za-z0-9_-]{32,}', '[redacted-long-token]', text)
                  text = re.sub(r'[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}', '[redacted-email]', text)
                  print(name)
                  print(text)
          PY
