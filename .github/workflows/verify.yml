name: Verify Hellabit
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Prepare patched SQLite in the disposable Python runtime
        run: |
          python3 - <<'PY'
          import hashlib
          import io
          import os
          import tarfile
          import urllib.request
          from pathlib import Path
          url = 'https://www.sqlite.org/2026/sqlite-autoconf-3540100.tar.gz'
          with urllib.request.urlopen(url, timeout=30) as response:
              source = response.read(10000000)
          expected = 'b6ced585c750916b1052667239a12c25a7ff34e7f06e1e6e01ecb0427657d9c4'
          if hashlib.sha3_256(source).hexdigest() != expected:
              raise SystemExit('SQLite source checksum mismatch')
          destination = Path(os.environ['RUNNER_TEMP']) / 'hellabit-sqlite-source'
          destination.mkdir(mode=0o700)
          with tarfile.open(fileobj=io.BytesIO(source), mode='r:gz') as archive:
              archive.extractall(destination, filter='data')
          PY
          hellabit_python_prefix="$(python3 -c 'import sys; print(sys.prefix)')"
          cd "$RUNNER_TEMP/hellabit-sqlite-source/sqlite-autoconf-3540100"
          ./configure --prefix="$hellabit_python_prefix"
          make -j2
          sudo make install
          sudo ldconfig "$hellabit_python_prefix/lib"
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          import sqlite3
          from hellabit.ledger import require_safe_sqlite
          print('Loaded SQLite:', sqlite3.sqlite_version)
          require_safe_sqlite()
          PY
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python3 scripts/bootstrap_api.py
      - run: npx playwright install --with-deps chromium
      - run: python3 scripts/verify.py
      - name: Retain the exact tested package and commit-bound receipt
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path
          result = json.loads(Path('evidence/terminal-result.json').read_text())
          if result.get('status') != 'local-verified' or not result.get('ok'):
              raise SystemExit('Complete verification is required')
          archive = Path(result['archive'])
          actual = hashlib.sha256(archive.read_bytes()).hexdigest()
          if actual != result['archiveSha256']:
              raise SystemExit('Tested package changed')
          target = Path('release/ci-tested')
          target.mkdir()
          shutil.copyfile(archive, target / archive.name)
          receipt = {
              'schema': 'hellabit.ci-tested-artifact.v1',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'commit': os.environ['GITHUB_SHA'],
              'run': os.environ['GITHUB_RUN_ID'],
              'attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'archive': archive.name,
              'archiveSha256': actual,
              'sourceTreeSha256': result['sourceTreeSha256'],
              'verification': 'passed',
              'productionReady': False,
              'externalTransactions': 0,
          }
          (target / 'TESTED.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hellabit-tested-${{ github.sha }}
          path: release/ci-tested/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Report verification failure
        if: failure()
        run: |
          python3 - <<'PY'
          import re
          import sqlite3
          from pathlib import Path
          print('Loaded SQLite:', sqlite3.sqlite_version)
          for name in ('evidence/terminal-result.json', 'evidence/python-tests.log', 'evidence/contracts.log', 'evidence/sdk.log', 'evidence/browser.log'):
              path = Path(name)
              if path.is_file():
                  text = path.read_text(errors='replace')[-16000:]
                  text = re.sub(r'[A-Za-z0-9_-]{32,}', '[redacted-long-token]', text)
                  text = re.sub(r'[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}', '[redacted-email]', text)
                  print(name)
                  print(text)
          PY
